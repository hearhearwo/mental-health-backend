spring:
  # SMTP 全部从环境变量读。不配也能跑：验证码会打到控制台日志（开发模式）
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.socketFactory.class: javax.net.ssl.SSLSocketFactory

  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.mentalhealth.entity

jwt:
  # 优先读环境变量 JWT_SECRET，没设时用下面这个仅供本地开发的默认值。
  # ⚠️ 部署上线必须设置 JWT_SECRET：这个默认值在公开仓库里是可见的，
  #    用它签发的 token 任何人都能伪造。
  # HS256 要求密钥至少 256 位（32 字节）
  secret: ${JWT_SECRET:mental-health-local-dev-only-secret-not-for-production-2026}
  # token 有效期（分钟），默认 1 天
  expire-minutes: 1440

app:
  email-code:
    # 验证码有效期（分钟）
    expire-minutes: 5
    # 同一邮箱两次发送的最小间隔（秒），防刷
    resend-seconds: 60
    # 单个验证码最多允许试错次数，超过即作废，防爆破
    max-attempts: 5

deepseek:
  # 从环境变量 DEEPSEEK_API_KEY 读取，不要写死在文件里
  # 留空则自动回退到本地规则回复，聊天功能仍可用
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-chat
